[package]
name = "tauri-plugin-content-filter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri plugin: activate and control the Digiexam content-filter system extension"
links = "tauri-plugin-content-filter"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
filter-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = "2"
thiserror = "2"

# macOS only: everything this plugin does is Apple frameworks. On any other platform the crate
# still compiles (the commands return an unsupported-platform error) so the app can be built and
# the UI worked on from a non-Mac.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2", "NSString", "NSError"] }
objc2-network-extension = { version = "0.3", features = ["block2"] }
objc2-system-extensions = { version = "0.3", features = ["dispatch2"] }
block2 = "0.6"
dispatch2 = "0.3"
