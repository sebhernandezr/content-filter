# Standalone workspace on purpose — see the note in the repo-root Cargo.toml. This binary runs as
# root inside a NetworkExtension provider process; it must not inherit the container app's
# dependency graph.
[workspace]

[package]
name = "digiexam-content-filter"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "NEFilterDataProvider system extension for the Digiexam content filter"

# No [lib]: this is purely the executable installed at
# <bundle>.systemextension/Contents/MacOS/<bundle-id>.

[build-dependencies]
# Builds oslog_shim.c. Build-time only; nothing from `cc` ends up in the shipped binary.
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2", "NSData", "NSString", "NSURL"] }
objc2-network-extension = { version = "0.3", features = ["block2"] }
block2 = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep symbols: this process is debugged through Console.app and `log stream`, where a stripped
# binary turns any crash report into hex. The size saving is irrelevant for a ~400 KB extension.
strip = false
